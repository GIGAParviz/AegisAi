[project]
name = "aegisai"
version = "0.1.0"
description = "Aegis AI reliability platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "psutil",
    "redis>=8.1.0",
    "qdrant-client>=1.19.0",
    "langchain>=1.3.18",
    "langchain-openrouter>=0.2.8",
    "python-dotenv>=1.2.3",
    "langchain-openai>=1.6.0",
    "langchain-community>=0.4.2",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
    "rich>=15.0.0",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
